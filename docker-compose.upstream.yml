name: bff-upstreams

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123!"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123!' -C -Q 'SELECT 1' -b >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval '
          try { rs.status(); }
          catch (error) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }); }
        '
        for attempt in {1..30}; do
          if [ "$$(mongosh 'mongodb://mongodb:27017/?directConnection=true' --quiet --eval 'print(db.hello().isWritablePrimary)')" = true ]; then exit 0; fi
          sleep 2
        done
        exit 1

  products:
    image: mb0101/product-catalog-api@sha256:1814ef51bb86a2e34a4eff198c6fc1be31c9921b55fb4f5be12a02277b5e374d
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ProductCatalogDb: "Server=sql;Database=ProductsDb;User Id=sa;Password=YourStrong@Password123!;TrustServerCertificate=True"
      Database__ApplyMigrations: "true"
    ports:
      - "127.0.0.1:${PRODUCTS_PORT:-15000}:8080"

  users:
    image: mb0101/ecommerce-store-users-api@sha256:2242777af2ada38dc9f98ef593f3a0670f04a400027d76e999660f92ce64300e
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      MongoDbSettings__DatabaseName: bff-users-test
    ports:
      - "127.0.0.1:${USERS_PORT:-16500}:8080"

  invoice:
    image: mb0101/ecommerce-store-invoice-api@sha256:35059e4b5e3af8e3a89d61dd34d1453f9096c3892b026004d0b904b58f8be598
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      MongoDbSettings__DatabaseName: bff-invoice-test
      ExternalServices__ProductCatalog__BaseUrl: http://products:8080
    ports:
      - "127.0.0.1:${INVOICE_PORT:-17000}:8080"

  payments:
    image: mb0101/ecommerce-store-payments-api@sha256:eb0c6a55687fced658cbc7ec68e11515283e4cb677acedae2c139d850ba81672
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      invoice:
        condition: service_started
    environment:
      PAYMENTS_MONGODB_CONNECTION_STRING: mongodb://mongodb:27017/?replicaSet=rs0
      PAYMENTS_MONGODB_DATABASE_NAME: bff-payments-test
      PAYMENTS_ORDERS_API_BASE_URL: http://invoice:8080
    ports:
      - "127.0.0.1:${PAYMENTS_PORT:-18000}:8080"
