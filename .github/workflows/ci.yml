name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require master for manual runs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "::error::Select master for a manual CI run."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify source and scripts
        run: bash scripts/ci.sh source
      - name: Restore and build with NuGet Audit
        run: bash scripts/ci.sh build
      - name: Verify handwritten formatting
        run: bash scripts/ci.sh format

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test BFF with SQL Server, MongoDB and three upstream APIs
        env:
          BFF_PACT_DIR: ${{ github.workspace }}/artifacts/verification/pact-consumer-users
          BFF_INVOICE_PACT_DIR: ${{ github.workspace }}/artifacts/verification/pact-consumer-invoice
        run: VERIFY_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" bash scripts/ci.sh test
      - uses: actions/upload-artifact@v4
        with:
          name: bff-users-pact
          path: artifacts/verification/pact-consumer-users/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bff-invoice-pact
          path: artifacts/verification/pact-consumer-invoice/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-integration-test-results
          path: artifacts/verification/test/**/*.trx
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bff-handwritten-coverage
          path: artifacts/verification/test/handwritten-coverage.cobertura.xml
          if-no-files-found: warn

  pact-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - name: Build the BFF candidate
        run: dotnet build src/ECommerceStoreBFF.API/ECommerceStoreBFF.API.csproj --configuration Release
      - name: Verify the pinned Web registration Pact
        run: bash scripts/ci.sh pact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-bff-verification
          path: artifacts/verification/pact-provider/
          if-no-files-found: warn
          retention-days: 14

  publish-pact-verification:
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' && vars.PACT_REGISTRY_URL != '' &&
      (needs.pact-provider.result == 'success' || needs.pact-provider.result == 'failure')
    needs: pact-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: web-bff-verification
          path: pact-evidence
      - name: Publish the exact provider result
        env:
          PACT_REGISTRY_URL: ${{ vars.PACT_REGISTRY_URL }}
          PACT_PUBLISHER_TOKEN: ${{ secrets.PACT_PUBLISHER_TOKEN }}
        run: python3 scripts/pact/publish.py pact-evidence/verification.json web-bff-verification-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-bff-verification-receipt
          path: web-bff-verification-receipt.json
          if-no-files-found: error

  quality-gate:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, integration-tests, pact-provider, secret-scan, dependency-review]
    steps:
      - name: Require all mandatory jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          INTEGRATION: ${{ needs.integration-tests.result }}
          PACT_PROVIDER: ${{ needs.pact-provider.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          for job in BUILD INTEGRATION PACT_PROVIDER SECRET_SCAN; do
            if [[ "${!job}" != success ]]; then
              echo "$job must succeed; actual result: ${!job}" >&2
              exit 1
            fi
          done
          expected=success
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == workflow_dispatch ]]; then expected=skipped; fi
          if [[ "$DEPENDENCY_REVIEW" != "$expected" ]]; then
            echo "Dependency Review must be $expected; actual result: $DEPENDENCY_REVIEW" >&2
            exit 1
          fi

  publish-bff-consumer-pacts:
    if: >-
      always() && !cancelled() && needs.quality-gate.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master' && vars.PACT_REGISTRY_URL != ''
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bff-users-pact
          path: pact-input
      - name: Publish the BFF Users consumer Pact
        env:
          PACT_REGISTRY_URL: ${{ vars.PACT_REGISTRY_URL }}
          PACT_PUBLISHER_TOKEN: ${{ secrets.PACT_PUBLISHER_TOKEN }}
        run: python3 scripts/pact/publish_consumer.py pact-input bff-users-publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: bff-users-publication
          path: bff-users-publication.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: bff-invoice-pact
          path: invoice-pact-input
      - name: Publish the BFF Invoice consumer Pact
        env:
          PACT_REGISTRY_URL: ${{ vars.PACT_REGISTRY_URL }}
          PACT_PUBLISHER_TOKEN: ${{ secrets.PACT_PUBLISHER_TOKEN }}
        run: python3 scripts/pact/publish_consumer.py invoice-pact-input bff-invoice-publication.json --provider invoice
      - uses: actions/upload-artifact@v4
        with:
          name: bff-invoice-publication
          path: bff-invoice-publication.json
          if-no-files-found: error

  docker-image:
    if: ${{ always() && !cancelled() && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ECommerceStoreBFF.API/Dockerfile
          push: false
          load: true
          tags: ecommerce-store-bff:ci

      - name: Smoke test the built image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name bff-image-smoke -p 127.0.0.1::8080 ecommerce-store-bff:ci
          trap 'docker rm -f bff-image-smoke >/dev/null' EXIT
          address="$(docker port bff-image-smoke 8080/tcp)"
          for attempt in {1..30}; do
            if curl --fail --silent "http://$address/health" | grep -qx 'Healthy'; then
              exit 0
            fi
            sleep 1
          done
          docker logs bff-image-smoke
          exit 1

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-bff:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Record scanned image identity
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-bff:ci)"
          test -n "$image_id"
          echo "Scanned image ID: $image_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          repository=mb0101/ecommerce-store-bff-api
          sha_tag="$repository:$GITHUB_SHA"
          latest_tag="$repository:latest"
          scanned_id="$(docker image inspect --format '{{.Id}}' ecommerce-store-bff:ci)"

          docker tag ecommerce-store-bff:ci "$sha_tag"
          docker tag ecommerce-store-bff:ci "$latest_tag"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          test "$scanned_id" = "$(docker image inspect --format '{{.Id}}' "$latest_tag")"

          docker push "$sha_tag" | tee "$RUNNER_TEMP/push-sha.log"
          docker push "$latest_tag" | tee "$RUNNER_TEMP/push-latest.log"
          sha_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-sha.log" | tail -n 1)"
          latest_digest="$(awk '/digest: sha256:/ { print $3 }' "$RUNNER_TEMP/push-latest.log" | tail -n 1)"
          test -n "$sha_digest"
          test "$sha_digest" = "$latest_digest"
          echo "Published $sha_tag and $latest_tag from image $scanned_id with digest $sha_digest" >> "$GITHUB_STEP_SUMMARY"
